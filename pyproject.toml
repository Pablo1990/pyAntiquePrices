[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyantique-prices"
version = "0.1.0"
description = "Estimate the price and age of antiques from an image using a local LLM via Ollama"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
]
hf = [
    "torch>=2.8.0",
    "transformers>=4.57.6",
    "peft>=0.20.0",
]

[project.scripts]
pyantique-prices = "pyantique_prices.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyantique_prices*"]
